name: Prototype YouTube acquisition seam

on:
  workflow_dispatch:
  push:
    branches:
      - feature/prototype-youtube-acquisition
    paths:
      - prototypes/youtube-acquisition/**
      - .github/workflows/prototype-youtube-acquisition.yml

jobs:
  self-check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python prototypes/youtube-acquisition/run.py --self-check
