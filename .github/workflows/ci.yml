name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - feature/implementation-plan

permissions:
  contents: read

jobs:
  linux-preview-containment:
    name: Ubuntu 24.04 containment preview
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.13.11
      - name: Build Landlock, seccomp, and cgroup launcher
        run: python tools/build-native-containment.py --output-root dist/containment
      - name: Verify the launcher fails closed outside its delegated scope
        shell: bash
        run: |
          set +e
          output="$(dist/containment/open-chords-containment-launcher \
            --expected-unit=not-the-current.scope \
            --workspace="$RUNNER_TEMP" \
            --runtime-root="$GITHUB_WORKSPACE" \
            -- /bin/true 2>&1)"
          status=$?
          set -e
          test "$status" -eq 70
          test "$output" = 'OC_CONTAINMENT_V1 {"error":"cgroup_scope_unverified"}'

  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 15 arm64
            os: macos-15
            arch: arm64
            profile: darwin-arm64
          - name: Windows Server 2025 x64 build profile
            os: windows-2025
            arch: x64
            profile: windows-server-2025-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: 3.13.11
          cache: pip
          cache-dependency-path: |
            sidecar/requirements-build.txt
            sidecar/alignment/requirements-builder.txt
            sidecar/acquisition/requirements.txt
            sidecar/alignment/osx-arm64.json
            sidecar/alignment/win-64.json
      - name: Activate exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.1 --activate
      - name: Verify native architecture
        shell: bash
        run: test "$(node -p process.arch)" = "${{ matrix.arch }}"
      - name: Install reviewed dependencies
        run: pnpm install --frozen-lockfile
      - name: Install exact sidecar build dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --only-binary=:all: -r sidecar/requirements-build.txt
      - name: Install exact acquisition dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --only-binary=:all: -r sidecar/acquisition/requirements.txt
      - name: Assemble the pinned Extractor Worker runtime
        run: python tools/build-acquisition-runtime.py --output-root dist/acquisition-runtime
      - name: Install checksum-verified Electron binary
        run: pnpm electron:install
      - name: Check formatting
        run: pnpm format:check
      - name: Lint with type information
        run: pnpm lint
      - name: Check strict TypeScript projects
        run: pnpm typecheck
      - name: Run foundation tests
        run: pnpm test
      - name: Verify generated contract schema
        run: pnpm contracts:schema:check
      - name: Validate TypeScript contract fixtures
        run: pnpm test:fixtures
      - name: Validate Python contract fixtures
        run: pnpm test:python
      - name: Run isolated renderer smoke test
        run: pnpm test:renderer
      - name: Measure representative workspace fixtures
        env:
          OPEN_CHORDS_PROFILE_WORKSPACE: "1"
        run: pnpm exec playwright test tests/renderer/workspace.spec.ts --grep "profile committed" --retries=0 --output=test-results/performance
      - name: Preserve workspace accessibility and performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-evidence-${{ matrix.profile }}
          path: test-results/
          if-no-files-found: ignore
      - name: Build reviewed FFmpeg on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          tools/test-ffmpeg-build-manifest-reader.sh python3
          tools/build-ffmpeg.sh ${{ matrix.profile }} build/native
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          install: >-
            base-devel
            curl
            jq
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libwinpthread
            perl
            tar
            xz
      - name: Export UCRT64 tools
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: echo "$(cygpath -w /ucrt64/bin)" >> "$GITHUB_PATH"
      - name: Build reviewed FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          tools/test-ffmpeg-build-manifest-reader.sh jq
          tools/test-windows-ffmpeg-runtime-verifier.sh
          tools/build-ffmpeg.sh ${{ matrix.profile }} build/native
      - name: Assemble frozen one-folder sidecar
        run: >-
          python tools/build-analysis-sidecar.py
          --build-id ${{ github.sha }}
          --native-root build/native/${{ matrix.profile }}
          --output-root dist/analysis-sidecar
          --platform-profile ${{ matrix.profile }}
      - name: Validate frozen Windows runtime outside sandbox
        if: runner.os == 'Windows'
        run: pnpm test:frozen-sidecar
      - name: Build native containment broker
        run: python tools/build-native-containment.py --output-root dist/containment
      - name: Build and prove the exact self-contained MFA runtime
        run: python tools/build-alignment-runtime.py --build-root build/alignment-runtime --output-root dist/alignment-runtime
      - name: Upload alignment runtime measurement
        uses: actions/upload-artifact@v4
        with:
          name: alignment-runtime-evidence-${{ matrix.profile }}
          path: |
            dist/alignment-runtime/measurement.json
            dist/alignment-runtime/open-chords-alignment/runtime-info.json
      - name: Build installable Forge artifact
        run: pnpm make -- --arch=${{ matrix.arch }}
      - name: Verify installed trust boundary
        run: pnpm test:packaged --retries=0
      - name: Observe live installed YouTube playback
        if: github.event_name == 'workflow_dispatch'
        env:
          OPEN_CHORDS_LIVE_YOUTUBE: "1"
        run: pnpm exec playwright test tests/packaged/youtube.spec.ts --grep "installed live" --retries=0 --output=test-results/youtube-live
      - name: Preserve installed YouTube observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-evidence-${{ matrix.profile }}
          path: test-results/youtube-live/
          if-no-files-found: ignore
      - name: Preserve the release-owned artifact for native assistive technology verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-artifact-${{ matrix.profile }}
          path: out/make/zip/${{ runner.os == 'macOS' && 'darwin' || 'win32' }}/${{ matrix.arch }}/*.zip
          retention-days: 7
          if-no-files-found: ignore
