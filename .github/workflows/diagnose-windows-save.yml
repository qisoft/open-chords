name: Diagnose Windows Save
on: pull_request
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Activate exact pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm electron:install
      - run: pnpm build:test
      - run: pnpm exec playwright test tests/renderer/workspace.spec.ts --grep "low-confidence chord|review mappings retain" --repeat-each=3 --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-save-diagnostic
          path: test-results/
